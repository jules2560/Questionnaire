<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Europe Road Trip 2</title>
    <style>
        /* Base page and collage background */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; /* Prevent scrolling when collage is active or button moves */
            position: relative;
        }

        /* Photo collage pattern for background outside the card */
        #photo-collage-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #f0f0f0; /* Default background */
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(4, 1fr);
            z-index: -1; /* Behind the card */
            overflow: hidden;
        }
        #photo-collage-background img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.6; /* Slight transparency for collage effect */
        }

        /* Central Card and pages */
        .page {
            display: none;
            text-align: center;
            /* Pale pink central card */
            background: #fdf2f2;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); /* Deeper shadow */
            width: 500px; /* Wider to accommodate 2 columns */
            position: relative; /* Container for absolute button */
            z-index: 1; /* On top of collage */
            max-height: 90vh;
            overflow-y: auto;
        }
        .page.active {
            display: block;
        }
        h2 {
            margin-bottom: 30px;
        }

        /* Buttons and answers */
        button {
            padding: 12px 24px;
            font-size: 16px;
            margin: 10px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            transition: all 0.3s ease; /* Smooth hover effects */
            display: inline-block;
            width: auto;
            min-width: 80px;
        }
        button:hover {
            transform: translateY(-2px); /* Slight lift */
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Light green answers, dark text */
        .page-button-light-green {
            background-color: #bbfccb; /* Soft light green */
            color: #333; /* Dark gray text */
        }
        .page-button-light-green:hover {
            background-color: #a8efb7; /* Slightly darker light green */
        }

        /* Budapest, Stockholm, Madrid photos in answers */
        .destination-photo {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 5px;
            display: block;
        }
        .destination-button-light-green {
            background-color: #bbfccb; /* Light green background */
            color: #333;
            padding: 8px; /* Add padding for visibility */
            display: inline-block;
            text-align: center;
            overflow: hidden;
            width: 45%;
            height: auto;
            border: 2px solid #a8efb7;
            font-weight: bold;
            font-size: 12px;
            margin: 8px 2%;
            vertical-align: top;
        }
        .destination-button-light-green:hover {
            background-color: #a8efb7; /* Darker green on hover */
        }
        .destination-button-light-green img {
            margin-bottom: 5px;
        }

        /* Container for 2-column layout */
        #destinations-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 20px;
        }

        /* Button container for page 1 - centered layout */
        #button-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
            min-height: 60px;
            position: relative;
        }

        /* No button special styling */
        #btn-non {
            background-color: #dc3545; /* Red as specified previously */
            color: white;
            /* Start positioned absolutely for escaping */
            position: absolute;
            /* Add smooth transitions for movement */
            transition: left 0.08s ease-out, top 0.08s ease-out; 
            z-index: 2; /* On top of regular buttons */
        }

        #page3 .page-button-light-green {
            display: block; /* Stack on other pages */
            width: 80%;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>

    <!-- Photo collage background outside the card -->
    <div id="photo-collage-background">
        <img src="images/Paris.jpeg" alt="Paris Collage">
        <img src="images/Budapest.jpeg" alt="Budapest Collage">
        <img src="images/Rome.jpeg" alt="Rome Collage">
        <img src="images/London.jpeg" alt="London Collage">
        <img src="images/Athens.jpeg" alt="Athens Collage">
        <img src="images/Berlin.jpeg" alt="Berlin">
        <img src="images/Madrid.jpeg" alt="Madrid">
        <img src="images/Stockholm.jpeg" alt="Stockholm">
        <img src="images/Paris.jpeg" alt="Paris Collage">
        <img src="images/Budapest.jpeg" alt="Budapest Collage">
        <img src="images/Rome.jpeg" alt="Rome Collage">
        <img src="images/London.jpeg" alt="London Collage">
        <img src="images/Athens.jpeg" alt="Athens Collage">
        <img src="images/Berlin.jpeg" alt="Berlin">
        <img src="images/Madrid.jpeg" alt="Madrid">
        <img src="images/Stockholm.jpeg" alt="Stockholm">
        <img src="images/Paris.jpeg" alt="Paris Collage">
        <img src="images/Budapest.jpeg" alt="Budapest Collage">
        <img src="images/Rome.jpeg" alt="Rome Collage">
        <img src="images/London.jpeg" alt="London Collage">
        <img src="images/Athens.jpeg" alt="Athens Collage">
        <img src="images/Berlin.jpeg" alt="Berlin">
        <img src="images/Madrid.jpeg" alt="Madrid">
        <img src="images/Stockholm.jpeg" alt="Stockholm">
    </div>

    <!-- Page 1 -->
    <div id="page1" class="page active">
        <h2> Quand tu rentreras, on part en weekend ?</h2>
        
        <div id="button-container">
            <button id="btn-oui" class="page-button-light-green" onclick="changerPage(2)">Oui</button>
            <!-- The 'Non' button will escape aggressively -->
            <button id="btn-non">Non</button>
        </div>
    </div>

    <!-- Page 2 -->
    <div id="page2" class="page">
        <h2>Super ! Tu as cliqué sur Oui, maintenant il faut choisir la destination ;)</h2>
        
        <div id="destinations-grid">
            <button class="destination-button-light-green" onclick="choisirDestination('Paris')">
                <img src="images/Paris.jpeg" alt="Paris" class="destination-photo">
                Paris
            </button>
            <button class="destination-button-light-green" onclick="choisirDestination('Budapest')">
                <img src="images/Budapest.jpeg" alt="Budapest" class="destination-photo">
                Budapest
            </button>
            <button class="destination-button-light-green" onclick="choisirDestination('Rome')">
                <img src="images/Rome.jpeg" alt="Rome" class="destination-photo">
                Rome
            </button>
            <button class="destination-button-light-green" onclick="choisirDestination('London')">
                <img src="images/London.jpeg" alt="London" class="destination-photo">
                London
            </button>
            <button class="destination-button-light-green" onclick="choisirDestination('Athens')">
                <img src="images/Athens.jpeg" alt="Athens" class="destination-photo">
                Athens
            </button>
            <button class="destination-button-light-green" onclick="choisirDestination('Berlin')">
                <img src="images/Berlin.jpeg" alt="Berlin" class="destination-photo">
                Berlin
            </button>
            <button class="destination-button-light-green" onclick="choisirDestination('Madrid')">
                <img src="images/Madrid.jpeg" alt="Madrid" class="destination-photo">
                Madrid
            </button>
            <button class="destination-button-light-green" onclick="choisirDestination('Stockholm')">
                <img src="images/Stockholm.jpeg" alt="Stockholm" class="destination-photo">
                Stockholm
            </button>
        </div>
    </div>

    <!-- Page 3 -->
    <div id="page3" class="page">
        <h2> Si tu as des commentaires à faire, n'hésites pas ! Hâte de les lire ;)</h2>
        <textarea id="reponse3" rows="4" placeholder="Ton avis, tes idées..." style="padding: 10px; width: calc(80% - 22px); margin-left: auto; margin-right: auto; border-radius: 5px; border: 1px solid #ccc;"></textarea>
        <br><br>
        <button id="btn-terminer" class="page-button-light-green" onclick="terminer()">Terminer</button>
    </div>

    <!-- Hidden form for Formspree -->
    <form id="email-form" action="https://formspree.io/f/mkjndzal" method="POST" style="display:none;">
        <input type="hidden" name="destination" id="form-destination">
        <input type="hidden" name="commentaire" id="form-commentaire">
        <input type="hidden" name="email" value="jules.jacquin@icloud.com">
    </form>

    <script>
      
// --- 1. Bouton "Non" fuyant sur les deux axes ---

const btnNon = document.getElementById('btn-non');
const btnOui = document.getElementById('btn-oui');
const page1 = document.getElementById('page1');
const buttonContainer = document.getElementById('button-container');

// Position initiale du bouton "Non"
window.addEventListener('load', () => {
    const ouiRect = btnOui.getBoundingClientRect();
    const pageRect = page1.getBoundingClientRect();

    btnNon.style.position = 'absolute';

    // Place "Non" à droite de "Oui"
    btnNon.style.left = (ouiRect.right - pageRect.left + 20) + 'px';
    btnNon.style.top = (ouiRect.top - pageRect.top) + 'px';
});

// Le bouton fuit lorsque la souris s'approche
page1.addEventListener('mousemove', function(event) {

    const pageRect = page1.getBoundingClientRect();
    const btnRect = btnNon.getBoundingClientRect();

    // Distance à partir de laquelle le bouton fuit
    const detectionRadius = 100;

    // Centre du bouton
    const btnCenterX = btnRect.left + btnRect.width / 2;
    const btnCenterY = btnRect.top + btnRect.height / 2;

    // Distance entre la souris et le bouton
    const distance = Math.sqrt(
        Math.pow(event.clientX - btnCenterX, 2) +
        Math.pow(event.clientY - btnCenterY, 2)
    );

    if (distance < detectionRadius) {

        // Direction opposée à la souris
        let dx = btnCenterX - event.clientX;
        let dy = btnCenterY - event.clientY;

        // Si la souris est exactement au centre
        if (dx === 0 && dy === 0) {
            dx = Math.random() - 0.5;
            dy = Math.random() - 0.5;
        }

        // Normalisation du vecteur
        const longueur = Math.sqrt(dx * dx + dy * dy);

        dx /= longueur;
        dy /= longueur;

        // Distance de fuite
        const distanceFuite = 150;

        // Nouvelle position
        let newX =
            btnRect.left -
            pageRect.left +
            dx * distanceFuite;

        let newY =
            btnRect.top -
            pageRect.top +
            dy * distanceFuite;

        // Marge par rapport aux bords de la carte
        const marge = 10;

        // Limites horizontales
        const maxX =
            pageRect.width -
            btnNon.offsetWidth -
            marge;

        // Limites verticales
        const maxY =
            pageRect.height -
            btnNon.offsetHeight -
            marge;

        // Empêche le bouton de sortir de la carte
        newX = Math.max(marge, Math.min(newX, maxX));
        newY = Math.max(marge, Math.min(newY, maxY));

        // Nouvelle position
        btnNon.style.left = newX + 'px';
        btnNon.style.top = newY + 'px';
    }
});



        // --- 2. Logique pour changer de page ---
        function changerPage(numeroPage) {
            // Cache toutes les pages
            const pages = document.querySelectorAll('.page');
            pages.forEach(page => page.classList.remove('active'));

            // Affiche la page demandée
            document.getElementById('page' + numeroPage).classList.add('active');
        }

        // --- 3. Logique pour stocker la destination ---
        let destinationChoisie = "";
        function choisirDestination(ville) {
            destinationChoisie = ville;
            changerPage(3);
        }

        // --- 4. Logique de fin avec envoi d'email ---
        function terminer() {
            const commentaire = document.getElementById('reponse3').value;
            
            // Remplir le formulaire caché avec les données
            document.getElementById('form-destination').value = destinationChoisie;
            document.getElementById('form-commentaire').value = commentaire || 'Aucun';
            
            // Soumettre le formulaire à Formspree
            const form = document.getElementById('email-form');
            fetch(form.action, {
                method: 'POST',
                body: new FormData(form),
                headers: {
                    'Accept': 'application/json'
                }
            }).then(response => {
                if (response.ok) {
                    alert("C'est noté pour " + destinationChoisie + " ! \nCommentaire : " + (commentaire ? commentaire : "Aucun") + "\n\nEmail envoyé !");
                } else {
                    alert("C'est noté pour " + destinationChoisie + " ! \nCommentaire : " + (commentaire ? commentaire : "Aucun") + "\n\nEmail envoyé !");
                }
            }).catch(error => {
                alert("C'est noté pour " + destinationChoisie + " ! \nCommentaire : " + (commentaire ? commentaire : "Aucun") + "\n\nEmail envoyé !");
            });
        }
    </script>
</body>
</html>
