<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date ? !</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
            overflow: hidden;
        }
        .page {
            display: none;
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 350px;
        }
        .page.active {
            display: block;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            margin: 10px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .btn-destination {
            background-color: #28a745;
            display: block;
            width: 80%;
            margin: 10px auto;
        }
        .btn-destination:hover {
            background-color: #218838;
        }
        #btn-non {
            background-color: #dc3545;
            /* La transition rend la fuite du bouton plus fluide */
            transition: left 0.15s ease-out, top 0.15s ease-out; 
        }
    </style>
</head>
<body>

    <!-- Page 1 -->
    <div id="page1" class="page active">
        <h2>Dès que tu rentres, on part en weekend ?</h2>
        <br>
        <button onclick="changerPage(2)">Oui</button>
        <button id="btn-non">Non</button>
    </div>

    <!-- Page 2 -->
    <div id="page2" class="page">
        <h2>Super ! Tu as cliqué sur Oui, maintenant il faut choisir la destination ;)</h2>
        <br>
        <button class="btn-destination" onclick="choisirDestination('Budapest')">Budapest</button>
        <button class="btn-destination" onclick="choisirDestination('Stockholm')">Stockholm</button>
        <button class="btn-destination" onclick="choisirDestination('Madrid')">Madrid</button>
    </div>

    <!-- Page 3 -->
    <div id="page3" class="page">
        <h2>Toute idée est bonne à prendre, n'hésite pas à me dire ;)</h2>
        <br>
        <textarea id="reponse3" rows="5" placeholder="Ton avis, tes envies..." style="padding: 10px; width: 90%; border-radius: 5px; border: 1px solid #ccc;"></textarea>
        <br><br>
        <button onclick="terminer()">Terminer</button>
    </div>

    <script>
        // --- 1. Le "radar" pour le bouton Non ---
        document.addEventListener('mousemove', function(e) {
            const page1 = document.getElementById('page1');
            // On ne fait bouger le bouton que si on est sur la première page
            if (!page1.classList.contains('active')) return;

            const btnNon = document.getElementById('btn-non');
            const rect = btnNon.getBoundingClientRect();
            
            // Calcul du centre du bouton "Non"
            const btnCenterX = rect.left + rect.width / 2;
            const btnCenterY = rect.top + rect.height / 2;
            
            // Calcul de la distance entre la souris et le centre du bouton
            const distance = Math.hypot(e.clientX - btnCenterX, e.clientY - btnCenterY);
            
            // Si le curseur s'approche à moins de 90 pixels, le bouton fuit
            if (distance < 90) {
                const xMax = window.innerWidth - btnNon.offsetWidth - 20;
                const yMax = window.innerHeight - btnNon.offsetHeight - 20;
                
                // Nouvelles coordonnées aléatoires
                const randomX = Math.floor(Math.random() * xMax);
                const randomY = Math.floor(Math.random() * yMax);

                btnNon.style.position = 'absolute';
                btnNon.style.left = randomX + 'px';
                btnNon.style.top = randomY + 'px';
            }
        });

        // --- 2. Logique pour changer de page ---
        function changerPage(numeroPage) {
            const pages = document.querySelectorAll('.page');
            pages.forEach(page => page.classList.remove('active'));
            document.getElementById('page' + numeroPage).classList.add('active');
        }

        // --- 3. Logique pour stocker la destination ---
        let destinationChoisie = "";
        function choisirDestination(ville) {
            destinationChoisie = ville;
            changerPage(3);
        }

        // --- 4. Logique de fin ---
        function terminer() {
            const commentaire = document.getElementById('reponse3').value;
            alert("C'est noté pour " + destinationChoisie + " ! \nCommentaire : " + (commentaire ? commentaire : "Aucun"));
        }
    </script>
</body>
</html>
